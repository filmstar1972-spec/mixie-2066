<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101c50"><title>Mixie 2066 — Magische kleurenmix V10 3D Karakter Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#081a45;font-family:system-ui,-apple-system,sans-serif;color:white;text-align:center}.game{position:relative;width:min(100vw,550px);aspect-ratio:1024/1536;margin:auto;overflow:hidden}.bg{width:100%;height:100%;display:block}.hit{position:absolute;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.tab{top:16.5%;height:6%;border-radius:30px}.tab.active{box-shadow:inset 0 0 0 3px #ffe67c,0 0 14px #fff78c}.tab:nth-child(2){left:7%;width:25%}.tab:nth-child(3){left:33%;width:17%}.tab:nth-child(4){left:51%;width:20%}.tab:nth-child(5){left:72%;width:23%}.pick{top:83.4%;height:11.2%;width:15%;border-radius:18px}.pick.sel{box-shadow:inset 0 0 0 4px #fffa8c,0 0 16px 4px #fff6b6}.go{left:34%;top:72%;width:32%;height:6.3%;border-radius:50px}.stage{position:absolute;top:39%;left:11%;width:78%;height:30%;pointer-events:none;z-index:3}.actors{display:flex;align-items:center;justify-content:space-around;width:100%;height:100%;gap:5%;transition:opacity .3s}.actor{width:45%;max-height:82%;object-fit:contain;filter:drop-shadow(0 6px 12px #35107b);animation:float 2.2s ease-in-out infinite}.actor:nth-child(2){animation-delay:-1.1s}.actor.hide{opacity:0}.placeholder{width:100%;align-self:center;font-weight:900;font-size:clamp(14px,4vw,23px);text-shadow:0 2px 9px #190d5b;background:#111b6a8c;border-radius:25px;padding:9px}.mixing .actor:first-child{animation:joinleft 1.65s ease-in forwards}.mixing .actor:nth-child(2){animation:joinright 1.6s ease-in forwards}.flash{position:absolute;left:50%;top:53%;width:1px;height:1px;pointer-events:none;z-index:5;opacity:0}.mixing .flash{animation:burst 2.1s ease-in-out}.spark{position:absolute;left:50%;top:53%;font-size:22px;opacity:0;pointer-events:none;z-index:6}.mixing .spark{animation:spark 1.7s ease-out forwards;animation-delay:var(--delay)}.result{position:absolute;z-index:8;top:37%;left:10%;width:80%;height:33%;border:0;border-radius:28px;background:transparent;display:none;flex-direction:column;align-items:center;justify-content:center;padding:4px;gap:3px;filter:drop-shadow(0 4px 12px #35107b)}.result.show{display:flex;animation:pop .55s ease-out}.result img{max-height:78%;max-width:88%;object-fit:contain;filter:drop-shadow(0 0 16px #fff3a8);animation:reveal .85s cubic-bezier(.2,1.5,.4,1) both, float 2s 1s infinite}.result .emoji{font-size:clamp(58px,15vw,100px)}.result .name{font-weight:900;font-size:clamp(17px,5vw,28px);background:#222575e8;border:2px solid #ffe99c;border-radius:30px;padding:4px 14px;text-shadow:0 2px 3px #000}.result .repeat{font-size:clamp(11px,2.7vw,15px);background:#142a7ed9;border-radius:20px;padding:3px 8px}.result button{border:0;border-radius:30px;background:#ffe25b;padding:7px 16px;color:#13275e;font-weight:900;pointer-events:auto}.toast{position:absolute;z-index:12;left:14%;top:31%;width:72%;background:#132a83e8;border:2px solid white;border-radius:20px;padding:10px;display:none}.toast.show{display:block}.counter{position:absolute;top:78.5%;right:4%;background:#132a79e6;padding:3px 7px;border-radius:20px;font-size:11px}.footer{padding:8px 0 20px;font-size:12px;color:#dceaff}.voice{position:absolute;top:23%;right:5%;z-index:3;border-radius:20px;border:1px solid #ffffffaa;background:#164b9cda;color:white;padding:6px 10px;font-weight:bold;font-size:12px}@keyframes float{50%{transform:translateY(-8px)}}@keyframes joinleft{0%{transform:translateX(0);opacity:1}80%{transform:translateX(52%);opacity:1}100%{transform:translateX(52%);opacity:0}}@keyframes joinright{0%{transform:translateX(0);opacity:1}80%{transform:translateX(-52%);opacity:1}100%{transform:translateX(-52%);opacity:0}}@keyframes burst{0%,20%{opacity:0;box-shadow:0 0 0 0 #fff}65%{opacity:1;box-shadow:0 0 35px 20px #fff8be,0 0 70px 50px #ffc454}100%{opacity:0;box-shadow:0 0 0 0 #fff}}@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3)}40%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.4)}}@keyframes reveal{0%{opacity:0;transform:translateY(48px) scale(.15);filter:brightness(4)}60%{opacity:1;transform:translateY(-15px) scale(1.15)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.2s!important}}
</style></head><body><main class="game" id="game"><img class="bg" src="world.png" alt="Mixie magische wereld"><button class="hit tab active" data-cat="animal" aria-label="Dieren"></button><button class="hit tab" data-cat="fruit" aria-label="Fruit"></button><button class="hit tab" data-cat="object" aria-label="Spullen"></button><button class="hit tab" data-cat="mixies" aria-label="Mijn Mixies"></button><button class="voice" id="voice">🔇 Robotstem uit</button><section class="stage" id="stage"><div class="actors" id="actors"><div class="placeholder">Kies twee Mixies! ✨</div></div></section><div class="flash"></div><div id="sparks"></div><div class="result" id="result" aria-live="polite"><img id="resultImage" alt="" hidden><div class="emoji" id="resultEmoji"></div><div class="name" id="resultName"></div><div class="repeat">🔇 Kinderstemopnamen nog niet toegevoegd</div><button id="again">Opnieuw spelen ↻</button></div><button class="hit go" id="go" aria-label="Mengen!"></button><div id="palette"></div><div class="counter" id="counter">0 ontdekt</div><div class="toast" id="toast"></div></main><div class="footer">MIXIE • V10 3D-karakters • offline • Geen robotstem • Geluidsopnamen nog nodig</div><script>
const colors=[['red','Rood'],['yellow','Geel'],['blue','Blauw'],['green','Groen'],['purple','Paars'],['turquoise','Turquoise']];
// Each unordered pair has a defined result. The outcome color determines the appearance and label.
const recipes={
'blue+red':['Paars','paarse','🦋','vlinder','🍇','druif','🪁','vlieger'],
'red+yellow':['Oranje','oranje','🦊','vos','🍊','sinaasappel','🧸','teddybeer'],
'blue+yellow':['Groen','groene','🐸','kikker','🍏','appel','🌳','boom'],
'green+red':['Bruin','bruine','🐻','beer','🥥','kokosnoot','🧸','knuffelbeer'],
'purple+yellow':['Bruin','bruine','🦉','uil','🥥','kokosnoot','🪵','boomstam'],
'blue+green':['Turquoise','turquoise','🐬','dolfijn','🫐','braam','🪁','vlieger'],
'green+turquoise':['Zeegroen','groene','🐢','schildpad','🥝','kiwi','🪴','plant'],
'green+yellow':['Limoengroen','groene','🐢','schildpad','🍐','peer','🪴','plant'],
'purple+red':['Magenta','roze','🦩','flamingo','🍓','aardbei','🎀','strik'],
'purple+blue':['Indigo','blauwe','🦋','vlinder','🫐','braam','🎈','ballon'],
'red+turquoise':['Bruin','bruine','🐻','beer','🥥','kokosnoot','🧸','teddybeer'],
'yellow+turquoise':['Groen','groene','🐸','kikker','🍏','appel','🪴','plant'],
'purple+turquoise':['Blauwpaars','paarse','🦋','vlinder','🍇','druif','🪁','vlieger'],
'green+purple':['Donkergroen','groene','🐉','draak','🥝','kiwi','🧩','puzzel'],
'blue+turquoise':['Lichtblauw','blauwe','🐬','dolfijn','🫐','braam','🧊','ijsblokje'],
'red+green':['Bruin','bruine','🐻','beer','🥥','kokosnoot','🧸','knuffelbeer']};
const normalizedRecipes={};for(const [pair,recipe] of Object.entries(recipes)){normalizedRecipes[pair.split('+').sort().join('+')]=recipe;}
let selected=[],category='animal',busy=false,lastSpeech='',soundOn=true,roundTimer=null;const $=s=>document.querySelector(s);let saved=[];try{saved=JSON.parse(localStorage.getItem('mixie-v10-found')||'[]')}catch(e){}const found=new Set(saved);
const palette=$('#palette');colors.forEach(([id,label],i)=>{let b=document.createElement('button');b.className='hit pick';b.style.left=(2.2+i*16.05)+'%';b.dataset.color=id;b.setAttribute('aria-label',label);b.onclick=()=>{if(busy)return;$('#result').classList.remove('show');selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected.slice(-1),id];render()};palette.append(b)});
function render(){document.querySelectorAll('.pick').forEach(b=>b.classList.toggle('sel',selected.includes(b.dataset.color)));$('#actors').innerHTML=selected.length?selected.map(c=>'<img class="actor" src="'+c+'.png" alt="'+colors.find(x=>x[0]===c)[1]+' Mixie">').join(''):'<div class="placeholder">Kies twee Mixies! ✨</div>';$('#counter').textContent=found.size+' ontdekt'}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}
function speak(t){lastSpeech=t;const audio=document.getElementById('recordedVoice');if(audio&&audio.dataset.phrase===t){audio.currentTime=0;audio.play().catch(()=>{});}else{document.getElementById('voice').textContent='🔇 Opname ontbreekt';}}
$('#voice').onclick=()=>toast('Robotstem uit. Echte Nederlandse kinderstem wordt later toegevoegd.');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(busy)return;category=b.dataset.cat;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));if(category==='mixies')toast(found.size?'Mijn ontdekkingen: '+[...found].join(', '):'Nog geen ontdekkingen!')});
function reset(){clearTimeout(roundTimer);busy=false;selected=[];$('#game').classList.remove('mixing');$('#result').classList.remove('show');render()}$('#again').onclick=e=>{e.stopPropagation();reset()};$('#result').onclick=()=>{};
$('#go').onclick=()=>{if(busy)return;$('#result').classList.remove('show');if(selected.length!==2){toast('Kies eerst twee kleuren!');return}const key=[...selected].sort().join('+');let r=normalizedRecipes[key];if(!r){toast('Deze kleurenmix komt binnenkort!');return}busy=true;$('#game').classList.add('mixing');let sp=$('#sparks');sp.innerHTML='';for(let i=0;i<22;i++){let el=document.createElement('span');el.className='spark';el.textContent=i%2?'✦':'✧';let a=Math.random()*Math.PI*2,d=45+Math.random()*110;el.style.setProperty('--x',Math.cos(a)*d+'px');el.style.setProperty('--y',Math.sin(a)*d+'px');el.style.setProperty('--delay',(.1+Math.random()*.5)+'s');sp.append(el)}roundTimer=setTimeout(()=>{let idx=category==='fruit'?4:category==='object'?6:2;let label=category==='mixies'?'Mixie':r[idx+1];let phrase=category==='mixies'?'Wauw! Een '+r[0]+' Mixie! Jippie!':'Wauw! '+(label==='appel'?'Een '+r[1]+' appel':label==='ijsblokje'?'Een '+r[1]+' ijsblokje':'Een '+r[1]+' '+label)+'! Jippie!';$('#resultName').textContent=category==='mixies'?r[0]+' Mixie':r[1].charAt(0).toUpperCase()+r[1].slice(1)+' '+label;let image=$('#resultImage');image.hidden=false;$('#resultEmoji').hidden=true;$('#resultEmoji').textContent='';const kind=category==='fruit'?'fruit':category==='object'?'object':'animal';image.src=category==='mixies'?(r[0]==='Oranje'?'orange.png':r[0]==='Groen'||r[0]==='Limoengroen'||r[0]==='Donkergroen'||r[0]==='Zeegroen'?'green.png':r[0]==='Bruin'?'brown.png':r[0]==='Paars'||r[0]==='Blauwpaars'?'purple.png':r[0]==='Magenta'?'pink.png':r[0]==='Turquoise'||r[0]==='Lichtblauw'?'turquoise.png':'blue.png'):'discoveries/'+kind+'/'+label+'.png';image.alt=category==='mixies'?r[0]+' Mixie':label;image.onerror=()=>{image.onerror=null;image.hidden=true;$('#resultName').textContent='Afbeelding ontbreekt';};$('#game').classList.remove('mixing');$('#actors').innerHTML='';$('#result').classList.add('show');found.add(r[0]+' • '+label);try{localStorage.setItem('mixie-v10-found',JSON.stringify([...found]))}catch(e){}$('#counter').textContent=found.size+' ontdekt';busy=false},2050)};
render();
</script></body></html>
